<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="ME3D — Exploration planétaire">
<meta property="og:description" content="Explore la Terre, le Système solaire, le ciel étoilé et la Voie lactée en 3D.">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<meta name="description" content="ME3D — exploration interactive en 3D des planètes et des lunes du Système solaire.">
<title>ME3D — Exploration planétaire</title>
<link rel="stylesheet" href="./styles.css"></head>
<body><div id="app">
<div id="loading" role="status" aria-live="polite"><i></i><span id="loadingText">Préparation de ME3D…</span><div class="loading-track"><div id="loadingProgress"></div></div><small id="loadingPercent">0 %</small></div>
<canvas id="globe" aria-label="Système solaire 3D interactif"></canvas>
<div id="vignette"></div>
<div id="labels-layer"></div>
<div id="labels-solar"></div>

<header class="topbar">
  <button class="brand" id="brand" aria-label="Réinitialiser la vue ME3D"><span class="brand-mark"><span class="dot"></span></span><span class="brand-copy"><b>ME3D</b><small>EXPLORATION PLANÉTAIRE</small></span></button>
  <nav class="scenes glass" id="scenes" role="tablist" aria-label="Mondes à explorer"></nav>
  <div class="search" id="searchbox">
    <svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" placeholder="Rechercher une planète, une lune, une étoile ou un lieu…" aria-label="Rechercher une planète, un satellite, une étoile ou un lieu" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="results">
    <kbd>/</kbd>
    <div class="results" id="results" role="listbox"></div>
  </div>
  <div class="spacer"></div>
  <div class="tools">
    <button class="ibtn glass" id="layersBtn" aria-label="Calques" title="Calques (C)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></button>
    <button class="ibtn glass" id="settingsBtn" aria-label="Réglages" title="Réglages (S)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="ibtn glass" id="helpBtn" aria-label="Aide et crédits" title="Aide (?)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
    <button class="ibtn glass" id="fsBtn" aria-label="Plein écran" title="Plein écran (F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>
</header>

<div class="scene-tools glass" id="sceneTools" role="toolbar" aria-label="Outils de la scène active"></div>

<aside class="panel" id="panel" aria-live="polite">
  <div class="ph">
    <button class="close" id="close" aria-label="Fermer">×</button>
    <div class="kicker" id="peyebrow">Planète</div>
    <h2 id="pname">Terre</h2>
    <div class="sub" id="ptype"></div>
  </div>
  <div class="pb" id="details"></div>
</aside>

<div class="pop" id="layersPop" role="dialog" aria-label="Calques"></div>

<div class="timebar glass" id="timebar">
  <div class="tdate"><small>Date · UTC</small><b id="tdate">—</b></div>
  <button class="tbtn" id="tplay" title="Pause / lecture du temps (Espace)" aria-label="Pause"><svg id="tplayico" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <button class="tbtn" id="tspeed" title="Vitesse du temps">×1</button>
  <button class="tbtn" id="tminus" title="Reculer d’un jour" aria-label="Reculer d’un jour">−1 j</button>
  <button class="tbtn" id="tplus" title="Avancer d’un jour" aria-label="Avancer d’un jour">+1 j</button>
  <button class="tbtn" id="tdatepick" title="Choisir une date et une heure simulées">Date</button>
  <button class="tbtn" id="tnow" title="Revenir à maintenant">Maintenant</button>
</div>

<div class="dock glass" id="dock" role="toolbar" aria-label="Outils de navigation">
  <button class="dbtn" id="reset" data-tip="Vue d'ensemble (R)" aria-label="Vue d'ensemble"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg></button>
  <button class="dbtn" id="zoomin" data-tip="Zoom avant (+)" aria-label="Zoom avant"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="dbtn" id="zoomout" data-tip="Zoom arrière (−)" aria-label="Zoom arrière"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <span class="sep"></span>
  <button class="dbtn" id="orbitsBtn" data-tip="Orbites (O)" aria-label="Afficher ou masquer les orbites"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="12" rx="9.3" ry="4.2" transform="rotate(-28 12 12)"/><ellipse cx="12" cy="12" rx="4.5" ry="9.1" transform="rotate(36 12 12)"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></button>
  <button class="dbtn" id="scaleBtn" data-tip="Échelle du système (E)" aria-label="Basculer entre échelle compacte et étendue"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 19 4M8 4h11v11"/><path d="M4 8v11h11"/></svg></button>
  <button class="dbtn" id="labels" data-tip="Noms des corps (L)" aria-label="Noms des corps célestes"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/></svg></button>
  <button class="dbtn" id="borders" data-tip="Frontières (B)" aria-label="Frontières"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
  <button class="dbtn" id="night" data-tip="Basculer jour / nuit (N)" aria-label="Basculer jour et nuit"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
</div>

<div class="scalechip glass" id="scalechip"><small>Altitude</small><b id="alt">—</b></div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"><button class="close" id="mclose" aria-label="Fermer">×</button><div id="mbody"></div></div></div>
<aside class="tour-card" id="tourCard" hidden aria-live="polite">
  <div class="tour-head"><div><small id="tourEyebrow">PARCOURS GUIDÉ</small><strong id="tourTitle">Découverte</strong></div><button type="button" id="tourClose" aria-label="Quitter le parcours">×</button></div>
  <p id="tourDescription"></p>
  <div class="tour-progress"><span id="tourStepText">Étape 1/5</span><div><i id="tourProgressFill"></i></div></div>
  <div class="tour-actions"><button type="button" class="pbtn" id="tourPrev">Précédent</button><button type="button" class="pbtn primary" id="tourNext">Suivant</button></div>
</aside>
<div class="toast" id="toast" role="status"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Filet de sécurité : tenter un miroir si le premier CDN est indisponible.
if (!window.THREE) {
  document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
}
window.ME3DShowError = function(title, detail) {
  const root = document.getElementById('loading');
  if (!root) return;
  root.classList.remove('hide');
  root.innerHTML = '<div class="load-error"><h2></h2><p></p><button type="button">Réessayer</button><a href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" target="_blank" rel="noopener">Tester la bibliothèque 3D</a></div>';
  root.querySelector('h2').textContent = title;
  root.querySelector('p').textContent = detail;
  root.querySelector('button').addEventListener('click', () => location.reload());
};
</script>
<script src="./app.js"></script></body></html>
